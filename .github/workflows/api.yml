name: Quality

on:
  pull_request:
    paths:
      - "api/**"
      - "front/**"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api.yml"
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "front/**"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api.yml"

jobs:
  secret-checks:
    name: Secret checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for committed secrets
        run: git ls-files -z | xargs -0 python3 api/scripts/secret_scanner.py

  api-checks:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      PYTHONPATH: "."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Typecheck
        run: uv run mypy app tests scripts

      - name: Test
        run: uv run pytest -q

      - name: Compile Python
        run: uv run python -m compileall app tests scripts

  api-docker-build:
    name: API Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --target development ./api

  front-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
